    <style>
      body {
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-size: 24px;
        padding: 20px;
      }

      .sb-topnav {
        padding: 20px;
      }
      #transferBtn {
        background-color: #ff6600;
      }
      #dropdownMenu {
        right: 0;
        left: auto;
      }
      #transferBtn:hover {
        background-color: #f68032;
      }
      .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        color: #ffffff;
      }

      .btn-primary:hover {
        background-color: #0069d9;
        border-color: #0062cc;
        color: #ffffff;
      }
      .container {
        display: flex;
        margin-top: 20px;

        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .updateContainer {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      .updateContainer h2 {
        color: #ff6600;
        text-align: center;
        margin-bottom: 20px;
      }
      label {
        color: #ff6600;
      }
      .form-control {
        border-color: #ff6600;
      }

      #navbarNav {
        justify-content: end;
        padding: 20px;
      }
      .flip-card-back {
        width: 500px;
        background-color: dodgerblue;
        color: white;
        background-color: rgb(170, 40, 40);
      }
      .flip-card-back {
        border-radius: 20px;
      }
      #number {
        font-size: 24px;
        letter-spacing: 10px;
      }
      @media only screen and (max-width: 460px) {
        .flip-card-back {
          width: 100%;
        }
        #number {
          font-size: 19px;
          letter-spacing: 5px;
        }
        .cardContainer {
          margin: 0px;
        }
      }

      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <form

            <input
              class="form-control"
              type="text"
              placeholder="Search for..."

            />

              <i class="fas fa-search"></i>

        </form>

            <ul

              aria-labelledby="navbarDropdown"
              id="dropdownMenu"
            >
              <li>
                <a class="dropdown-item" href="dashboard.html">Dashboard</a>
              </li>
              <li><a class="dropdown-item" href="#!">Settings</a></li>
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item" id="logout" href="index.html"
                  >Logout</a
                >
              </li>
              <li>
                <a class="dropdown-item" id="logout" href="admin.html">Admin</a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>
    <div class="row mt-5 cardContainer">
      <div class="col-12 d-flex justify-content-center">
        <div class="flip-card-back">
          <div class="row m-3">
            <div class="col-6">
              <div class="col-12 w-100 mt-5">
                <div>
                  <img src="./images/chip.png" style="width: 50px" />
                </div>
                <div id="number">****************</div>
              </div>
              <div class="row">
                <div class="col-2 w-50">
                  <div>CVV</div>
                  <div id="cvv">***</div>
                </div>
                <div class="col-2">
                  <div>EXP</div>
                  <div id="expiry">**/**</div>
                </div>

                <p id="full-name" class="mt-3">JOHN DOE</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="updateContainer">
        <h2>ACTIVATE CARD</h2>

        <form id="cardFormBox">
          <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input class="form-control" type="text" id="numberField" />
          </div>
          <div class="form-group">
            <label for="expiry">Expiry Date</label>
            <input class="form-control" type="date" id="expiryField" />
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input class="form-control" type="text" id="cvvField" />
          </div>

          <button
            class="mt-3 btn btn-primary border-0"
            id="transferBtn"
            type="submit"
          >
            Activate Card
          </button>
        </form>
      </div>
    </div>
